name: Checks

on:
  push:
    branches:
      - horny
  pull_request:
    branches:
      - horny

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build FemboyFans Image
        uses: docker/build-push-action@v4
        with:
          cache-from: type=gha
          load: true
          tags: hornybooru
          outputs: type=docker,dest=/tmp/hornybooru.tar

      - name: Upload FemboyFans Image
        uses: actions/upload-artifact@v4
        with:
          name: hornybooru
          path: /tmp/hornybooru.tar

      - name: Build DText Image
        uses: docker/build-push-action@v4
        with:
          context: "{{defaultContext}}:lib/dtext_rb"
          cache-from: type=gha
          load: true
          tags: dtext
          outputs: type=docker,dest=/tmp/dtext.tar


      - name: Upload DText Image
        uses: actions/upload-artifact@v4
        with:
          name: dtext
          path: /tmp/dtext.tar

  rubocop:
    runs-on: ubuntu-22.04
    needs: docker-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Load FemboyFans Image
        uses: ./.github/load-docker-image
        with:
          name: hornybooru

      - name: Run Rubocop
        run: $DOCKER_RUN rubocop --format github

  eslint:
    runs-on: ubuntu-22.04
    needs: docker-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Load FemboyFans Image
        uses: ./.github/load-docker-image
        with:
          name: hornybooru

      - name: Run ESLint
        run: $DOCKER_RUN linter
